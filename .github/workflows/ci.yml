name: SQA CI & CT Pipeline
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4   # upgrade ke v4 untuk menghindari warning Node.js 20

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: json, pdo, mbstring

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Fix permissions for vendor/bin
        run: chmod +x vendor/bin/phpunit

      - name: Run PHPUnit & Quality Metrics
        run: vendor/bin/phpunit tests/ --coverage-text --coverage-filter src/

      - name: Setup Node.js for Cypress
        uses: actions/setup-node@v4   # upgrade ke v4
        with:
          node-version: 18

      - name: Install NPM Dependencies
        run: npm install

      - name: Start PHP Server in Background
        run: php -S localhost:8000 &

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6   # upgrade ke v6
        with:
          wait-on: 'http://localhost:8000'
          wait-on-timeout: 120